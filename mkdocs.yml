site_name: netbox-permissions-matrix-plugin
site_description: Show and edit NetBox object permissions as a matrix of object types and groups.
site_url: https://thomaschristory.github.io/netbox-permissions-matrix-plugin/
repo_url: https://github.com/thomaschristory/netbox-permissions-matrix-plugin
repo_name: netbox-permissions-matrix-plugin
edit_uri: ""
# Built with Zensical (make docs), which reads this file. Zensical publishes everything under docs_dir, so make docs
# builds from a staging copy of the files git can see.
docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Configuration: configuration.md
  - Using the plugin:
      - The matrix: matrix.md
      - How changes map to permissions: changes.md
      - Constraints: constraints.md
      - Who can: who-can.md
      - Group tab: group-tab.md
      - Export and import: export-import.md
      - Permissions: permissions.md
      - REST API: api.md
  - Operations:
      - Limitations: limitations.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Development: development.md
      - Design: DESIGN.md
      - Changelog: changelog.md
