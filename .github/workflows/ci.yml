name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    name: unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # The planner (core/) is plain Python; NetBox is not needed.
      - run: uv sync --locked
      - run: uv run pytest -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: python3 dev/scripts/check_dist.py dist

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make docs

  netbox-integration:
    name: integration tests on NetBox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The lowest supported NetBox (min_version), the latest patch, and NetBox's next release ("feature"). The feature
    # job warns early about upcoming breakage but does not block a merge.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox: "v4.7.2"
            experimental: false
          - netbox: "v4.7.3"
            experimental: false
          - netbox: "feature"
            experimental: true
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: valkey/valkey:9.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install NetBox and plugin
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e ./plugin
      - name: Lift max_version
        # max_version refuses NetBox's next minor; the feature job tests it anyway, to tell when max_version can rise.
        if: matrix.experimental
        run: sed -i 's/^\( *max_version = \).*/\1None/' plugin/netbox_permissions_matrix_plugin/__init__.py
      - name: Configure NetBox
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          cat >> netbox/netbox/netbox/configuration.py <<'EOF'

          PLUGINS = ["netbox_permissions_matrix_plugin"]
          EOF
      - name: System check
        run: python netbox/netbox/manage.py check
      - name: No migrations
        # The plugin has no models; this fails if one is ever added without a migration.
        run: python netbox/netbox/manage.py makemigrations netbox_permissions_matrix_plugin --check --dry-run
      - name: Integration tests
        # Includes NetBox's OpenAPI schema check (test_api_schema), which needs the migrated test database.
        run: python netbox/netbox/manage.py test --noinput --parallel 1 "$GITHUB_WORKSPACE/plugin/tests_netbox"
      - name: Menu tests with menu_placement "admin"
        # NetBox builds its menus once, at start, from PLUGINS_CONFIG: run the menu tests again in a NetBox started
        # with the Admin-menu placement, so a change in NetBox's Admin menu fails here instead of silently moving the
        # item to the Plugins menu.
        run: |
          cat >> netbox/netbox/netbox/configuration.py <<'EOF'
          PLUGINS_CONFIG = {"netbox_permissions_matrix_plugin": {"menu_placement": "admin"}}
          EOF
          python netbox/netbox/manage.py test --noinput --parallel 1 -p test_menu.py "$GITHUB_WORKSPACE/plugin/tests_netbox"
