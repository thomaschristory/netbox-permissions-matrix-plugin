{% load i18n %}<span class="pm-swatch pm-{{ state }}" role="img" aria-label="{% if state == 'granted' %}{% trans 'Granted' %}{% elif state == 'constrained' %}{% trans 'Constrained' %}{% elif state == 'disabled' %}{% trans 'Disabled permission' %}{% else %}{% trans 'Not granted' %}{% endif %}" title="{% for p in cell_perms %}{{ p.name }}{% if not p.enabled %} ({% trans 'disabled' %}){% endif %}{% if p.constrained %}: {{ p.constraints }}{% endif %}{% if not forloop.last %}&#10;{% endif %}{% endfor %}"></span>{% for p in cell_perms %} <a href="{{ p.url }}" class="small">{{ p.name }}</a>{% endfor %}
