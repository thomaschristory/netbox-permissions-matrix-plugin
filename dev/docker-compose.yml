name: netbox-permissions-matrix-dev

x-netbox: &netbox
  build:
    context: ..
    dockerfile: dev/Dockerfile
  image: netbox-permissions-matrix-dev:local
  env_file: env/netbox.env
  user: "netbox:root"
  volumes:
    - ./configuration/plugins.py:/etc/netbox/config/plugins.py:ro
    - ../netbox_permissions_matrix_plugin:/plugin/netbox_permissions_matrix_plugin:ro
    - ../tests_netbox:/plugin/tests_netbox:ro
    - ./scripts:/plugin/dev/scripts:ro
    # Live CSS and JS edits without collectstatic.
    - ../netbox_permissions_matrix_plugin/static/netbox_permissions_matrix_plugin:/opt/netbox/netbox/static/netbox_permissions_matrix_plugin:ro

services:
  netbox:
    <<: *netbox
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
    # NETBOX_PORT=8010 make dev when another stack already uses 8000.
    ports: ["${NETBOX_PORT:-8000}:8080"]
    healthcheck:
      test: /opt/netbox/health.sh
      # A fresh database runs every migration first, which takes several minutes.
      start_period: 900s
      timeout: 3s
      interval: 15s

  netbox-worker:
    <<: *netbox
    depends_on:
      netbox: { condition: service_healthy }
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]

  postgres:
    image: docker.io/postgres:18-alpine
    env_file: env/postgres.env
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    env_file: env/redis.env
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5

  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    env_file: env/redis-cache.env
    command: ["sh", "-c", "valkey-server --requirepass $$REDIS_PASSWORD"]
    healthcheck: *redis-healthcheck

volumes:
  postgres-data:
